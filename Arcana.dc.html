<script type="text/x-dc" data-dc-script>
const ARCANA = [['0','THE FOOL',[['UTAKO','Character: Utako Yamanashi'],['IGOR','Character: Igor']],'fool'],['0','THE JESTER',null,'jester'],['I','THE MAGICIAN',[['SHOU','Character: Shou Satake']],'magician'],['I','THE COUNCILLOR',[['AGATHA','Character: Agatha'],['SAFIE','Character: Safie']],'councillor'],['II','THE PRIESTESS',[['AOI','Character: Aoi Tsukino']],'priestess'],['III','THE EMPRESS',[['ETSUKO','Character: Etsuko Odoriba']],'empress'],['IV','THE EMPEROR',[['KAZUMASA','Character: Kazumasa Odoriba']],'emperor'],['V','THE HIEROPHANT',[['MOTOSHIGE','Character: Motoshige Yamanashi']],'hierophant'],['V','THE APOSTLE',null,'apostle'],['VI','THE LOVERS',[['YUKINA','Character: Yukina Yoshie']],'lovers'],['VII','THE CHARIOT',[['GIKEN','Character: Giken Tsukino']],'chariot'],['VIII','JUSTICE',[['YORIKO','Character: Yoriko Mihara']],'justice'],['IX','THE HERMIT',[['KOUHEI','Character: Kouhei Inoue']],'hermit'],['X','FORTUNE',null,'fortune'],['XI','STRENGTH',[['TAKERU','Character: Takeru Magohei']],'strength'],['XI','HUNGER',null,'hunger'],['XII','THE HANGED MAN',null,'hanged-man'],['XIII','DEATH',[['DEATH','Character: Death Confidant']],'death'],['XIV','TEMPERANCE',null,'temperance'],['XV','THE DEVIL',null,'devil'],['XVI','THE TOWER',[['CHUUZENJI','Character: Chuuzenji']],'tower'],['XVII','THE STAR',[['CHESTER','Character: Chester']],'star'],['XVIII','THE MOON',[['SAYAKA','Character: Sayaka Kakureya']],'moon'],['XIX','THE SUN',null,'sun'],['XX','JUDGEMENT',null,'judgement'],['XX','AEON',null,'aeon'],['XXI','THE WORLD',null,'world'],['XXI','UNIVERSE',null,'universe'],['—','FAITH',null,'faith'],['—','HOPE',null,'hope']].map(([n, t, c, f]) => [n, t, c, f ? ((window.__resources && window.__resources['arc-' + f]) || 'assets/arcana/' + f + '.webp') : null]);
class Component extends DCLogic {
  componentDidMount() {
    this.onKey = e => { const el = e.target; if ((e.key === 'Enter' || e.key === ' ') && el?.getAttribute?.('role') === 'button') { e.preventDefault(); e.stopPropagation(); el.click(); } };
    document.addEventListener('keydown', this.onKey, true);
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    setTimeout(() => [...(document.querySelector('[data-anim="deck"]')?.children || [])].forEach((el, i) => el.animate([{ scale: 0, opacity: 0 }, { scale: 1.08, opacity: 1, offset: .7 }, { scale: 1 }], { duration: 300, delay: 80 + i * 16, easing: 'cubic-bezier(.16,1.25,.3,1)', fill: 'backwards' })), 50);
  }
  componentWillUnmount() { document.removeEventListener('keydown', this.onKey, true); }
  _imgRef(url) { this._refs = this._refs || {}; return this._refs[url] || (this._refs[url] = el => { if (el && el.getAttribute('src') !== url) { if (url) el.setAttribute('src', url); else el.removeAttribute('src'); } }); }
  renderVals() {
    const go = label => () => { location.href = 'Characters.dc.html?slide=' + encodeURIComponent(label); };
    const sel = this.state?.arcSel ?? 0;
    const setSel = i => () => { if ((this.state?.arcSel ?? 0) !== i) this.setState({ arcSel: i }); };
    const ROT = [-4, 3, -2, 5, -3, 2, -5, 4, -1, 3, -3];
    const EXTRA = ['THE JESTER','THE COUNCILLOR','THE APOSTLE','HUNGER','AEON','UNIVERSE','FAITH','HOPE'];
    const arcana = ARCANA.map(([num, name, chars, img], i) => ({
      num, name, img: img || '', imgRef: this._imgRef(img || ''), ex: EXTRA.includes(name), short: name.replace(/^THE /, ''),
      tagBg: i === sel ? '#ff4f00' : '#fff', tagFg: '#000',
      border: i === sel ? '5px solid #ff4f00' : '3px solid #fff',
      shadow: i === sel ? '8px 8px 0 #ff4f00' : '5px 5px 0 #000',
      filter: chars || i === sel ? 'none' : 'grayscale(.85) brightness(.6)',
      transform: i === sel ? 'translateY(-14px) scale(1.15) rotate(0deg)' : 'rotate(' + ROT[i % 11] + 'deg)',
      z: i === sel ? 5 : 1,
      hover: setSel(i),
      click: chars ? go(chars[0][1]) : setSel(i)
    }));
    const [sNum, sName, sChars, sImg] = ARCANA[sel];
    return { goHome: () => { location.href = 'Characters.dc.html'; }, arcana, selNum: sNum, selName: sName, selImg: sImg || '', selImgRef: this._imgRef(sImg || ''),
      selChars: (sChars || []).map(([n, l]) => ({ name: n, go: go(l) })), selNone: !sChars,
      selGo: sChars ? go(sChars[0][1]) : () => {} };
